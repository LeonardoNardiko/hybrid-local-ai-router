[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-local-ai-router"
version = "1.0.0"
description = "CAD-safe, VRAM-aware deterministic LLM router balancing local Ollama models and cloud APIs on engineering workstations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Leonardo de Lima Junior (Leonardo Nardiko)"}
]
urls = {Homepage = "https://tecnopro.me", Repository = "https://github.com/LeonardoNardiko/hybrid-local-ai-router"}
